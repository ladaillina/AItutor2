services:
  redis:
    image: redis:8
    container_name: aitutor2-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  postgres:
    image: postgres:17
    container_name: aitutor2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitutor2
      POSTGRES_USER: aitutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: aitutor2-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  api:
    build: .
    container_name: aitutor2-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aitutor:${POSTGRES_PASSWORD}@postgres:5432/aitutor2
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant

volumes:
  postgres_data:
  qdrant_data: